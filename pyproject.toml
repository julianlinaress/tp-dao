[project]
name = "biblioteca"
version = "0.1.0"
description = "Sistema de Préstamos Interbibliotecarios - TP Integrador DAO 2026"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib==3.11.2",
    "reportlab==5.1.0",
]

[dependency-groups]
dev = ["pytest==9.2.0"]

[project.scripts]
biblioteca = "biblioteca.__main__:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
